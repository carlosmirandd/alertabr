        <button role="tab" id="c-alertas" aria-selected="true">Alertas</button>
        <button role="tab" id="c-focos" aria-selected="false">Focos<span class="so-d"> de calor</span></button>

      <div class="status" id="status" aria-live="polite" title="Estado da conexão com os dados"><i class="dot"></i><span id="stTxt">carregando…</span></div>
      <button type="button" class="icone" id="tema" aria-label="Alternar entre tema claro e escuro"><svg class="ic" id="temaIc"><use href="#i-lua"/></svg></button>
    </header>

    <section class="resumo gl" id="resumo" aria-live="polite">
      <div class="r-tit"><div><h1 id="hTitulo">Brasil agora</h1><p id="hSub">Buscando os dados mais recentes…</p></div><span class="r-vivo" id="vivo"><i class="dot"></i><span id="vivoTxt">carregando…</span></span></div>
      <div class="r-stats" id="filtros" role="group" aria-label="Filtrar por gravidade ou ver focos de calor">
        <button type="button" class="st s3" data-sev="3" aria-pressed="false"><span><i></i>Grande<em> perigo</em></span><b id="n3">–</b></button>
        <button type="button" class="st s2" data-sev="2" aria-pressed="false"><span><i></i>Perigo</span><b id="n2">–</b></button>
        <button type="button" class="st s1" data-sev="1" aria-pressed="false"><span><i></i>Potencial</span><b id="n1">–</b></button>
        <button type="button" class="st fg" data-camada="focos" aria-pressed="false"><span><i></i>Focos<em> de calor</em></span><b id="nF">–</b></button>

      <div class="barra-p" aria-hidden="true"><i class="b3" id="bb3"></i><i class="b2" id="bb2"></i><i class="b1" id="bb1"></i></div>

      <div class="aba" id="aba-agora"></div>
      <div class="aba gl" id="aba-noticias"></div>
      <div class="aba gl" id="aba-cartao"></div>
